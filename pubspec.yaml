name: easyreading_rebuild
description: EasyReading app by Beytan Kun.
publish_to: 'none'

version: 0.8.4+100

environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  wakelock_plus: ^1.1.4
  audio_session: ^0.2.3
  just_audio: ^0.10.6
  cloud_functions: ^5.1.3

  # UI
  google_fonts: ^6.2.1
  purchases_flutter: ^10.4.0

  # OCR
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_language_id: ^0.13.0

  path_provider: ^2.1.5

  # Yerel kayıt / ayarlar
  shared_preferences: ^2.3.2
  path: ^1.9.0

  # Localizations + link açma
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.0

  # Dosya seçimi
  file_picker: ^10.0.0
  image_picker: ^1.0.7

  # TTS
  flutter_tts: ^4.2.3

  # PDF / DOCX / EPUB okuma
  syncfusion_flutter_pdf: ^29.2.11
  pdfrx: ^1.2.6
  docx_to_text: ^1.0.0
  epub_plus: ^5.1.0

  # HTTP / HTML parsing
  http: ^1.5.0
  html: ^0.15.4
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3

  # WebView
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.13

  # Bayrak ikonları
  country_flags: ^3.0.0

  # Uygulama kontrolü (ChatGPT)
  share_plus: ^10.1.2
  # Uygulama güncellemesi
  in_app_update: ^4.2.3

  # Bildirim sistemi
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  firebase_messaging: ^15.1.3
  flutter_timezone: ^5.0.2
  cloud_firestore: ^5.6.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo_gold.png
    - assets/easyreading_app_icon.png
    - assets/icon/app_icon.png
    - assets/reading_watermark.png
    - assets/icon/splash_icon.png
    - assets/READING_KID.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FCF3E3"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FCF3E3"
  image: assets/icon/splash_icon.png
  android: true
  android_12:
    image: assets/icon/splash_icon.png
    color: "#FCF3E3"
  ios: false

analyzer:
  exclude:
    - lib/main_LAST.dart
    - lib/english_menu.dart
    - lib/main_test_FAV_OK_*.dart
    - lib/**/_backup/**
